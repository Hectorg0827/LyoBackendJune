name: LYO live staging graded-answer and replay acceptance

on:
  push:
    branches: [rc/lyo-continuous-teaching-focused-backend-20261119]
    paths:
      - scripts/continuous_teaching_grading_replay_staging_smoke.py
      - .github/workflows/lyo-continuous-teaching-grading-replay-staging.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyo-staging-graded-replay-acceptance
  cancel-in-progress: false

jobs:
  graded-replay:
    name: Synthetic authenticated graded Classroom answer and replay (no production)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned transport-only dependencies
        run: python -m pip install --disable-pip-version-check httpx==0.28.1 websockets==15.0.1
      - name: Compile live-grading acceptance probe
        run: python -m py_compile scripts/continuous_teaching_grading_replay_staging_smoke.py
      - name: Test server-issued grading, replay and reconnect on pinned Railway staging
        env:
          LYO_STAGING_SMOKE_URL: https://lyo-continuousteaching-preview-backend-staging.up.railway.app
        run: python -u scripts/continuous_teaching_grading_replay_staging_smoke.py
