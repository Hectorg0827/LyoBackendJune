name: LYO Continuous Teaching staging safety and contract CI

on:
  push:
    branches: [feat/lyo-continuous-teaching-staging-20261118]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-teaching-backend-staging
  cancel-in-progress: true

jobs:
  bridge-contracts:
    name: Ephemeral bridge, provider-fallback and grading-isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: testing
      LYO_CONTINUOUS_TEACHING_STAGING: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated contract dependencies only
        run: python -m pip install --disable-pip-version-check pytest "pydantic>=2.10,<2.11"
      - name: Compile all changed backend modules
        run: python -m py_compile lyo_app/ai_classroom/continuous_teaching.py lyo_app/ai_classroom/sdui_models.py lyo_app/ai_classroom/websocket_routes.py tests/test_classroom_continuous_teaching.py
      - name: Verify strict ungraded bridge contract without live AI spending
        run: python -m pytest -q tests/test_classroom_continuous_teaching.py
