name: LYO Continuous Teaching staging safety and contract CI

on:
  push:
    branches: [rc/lyo-continuous-teaching-focused-backend-20261119]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-teaching-backend-staging
  cancel-in-progress: true

jobs:
  bridge-contracts:
    name: Ephemeral bridge, provider-fallback and grading-isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: testing
      LYO_CONTINUOUS_TEACHING_STAGING: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated contract dependencies only
        run: python -m pip install --disable-pip-version-check pytest "pydantic>=2.10,<2.11"
      - name: Compile all changed backend modules
        run: python -m py_compile lyo_app/ai_classroom/continuous_teaching.py lyo_app/ai_classroom/sdui_models.py lyo_app/ai_classroom/websocket_routes.py tests/test_classroom_continuous_teaching.py
      - name: Verify strict ungraded bridge contract without live AI spending
        # The repository-wide conftest boots a full SQL stack; use a temporary
        # isolated test directory for these pure, network-free bridge checks.
        run: |
          mkdir -p /tmp/lyo-bridge-contract-tests
          cp tests/test_classroom_continuous_teaching.py /tmp/lyo-bridge-contract-tests/test_bridge.py
          # Import only the actual bridge and wire-schema modules, avoiding the
          # parent Classroom package's unrelated SQL/cloud-service imports.
          python - <<'PY'
          import pathlib
          import sys
          import types
          import pytest
          import lyo_app

          package = types.ModuleType("lyo_app.ai_classroom")
          package.__path__ = [str(pathlib.Path.cwd() / "lyo_app" / "ai_classroom")]
          sys.modules["lyo_app.ai_classroom"] = package
          raise SystemExit(pytest.main([
              "-q", "-c", "/dev/null",
              "/tmp/lyo-bridge-contract-tests/test_bridge.py",
          ]))
          PY

  full-backend-regression:
    name: Full backend regression suite — unchanged production behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visual_test
          POSTGRES_PASSWORD: visual_test
          POSTGRES_DB: visual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visual_test -d visual_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "true"
      SECRET_KEY: test-secret-key-for-classroom-ci-at-least-32-characters
      ENVIRONMENT: development
      LYO_CONTINUOUS_TEACHING_STAGING: "0"
      CHAT_VISUAL_POSTGRES_URL: postgresql+asyncpg://visual_test:visual_test@localhost:5432/visual_test
      TEST_PREP_POSTGRES_URL: postgresql+asyncpg://visual_test:visual_test@localhost:5432/visual_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend regression dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/requirements-continuous-ci.txt
          python -m pip install --ignore-installed packaging -r /tmp/requirements-continuous-ci.txt
          python -m pip install pytest pytest-asyncio
      - name: Run existing backend tests with feature disabled (default)
        run: python -m pytest tests/ -q --ignore=tests/test_load.py
