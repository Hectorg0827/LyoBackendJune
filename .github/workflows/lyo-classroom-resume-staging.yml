name: LYO Classroom resume staging regression
# Source-only checks on isolated staging patch; no deployment or AI invocation.
on:
  push:
    branches: [fix/lyo-classroom-resume-20261122]
    paths:
      - 'lyo_app/ai_classroom/websocket_routes.py'
      - 'tests/test_web_classroom_resume_route.py'
      - '.github/workflows/lyo-classroom-resume-staging.yml'

permissions:
  contents: read

jobs:
  exact-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-classroom-resume-test-secret-minimum-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile lyo_app/ai_classroom/websocket_routes.py tests/test_web_classroom_resume_route.py
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-resume-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-resume-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Type/symbol hygiene and exact-scene tests
        run: |
          python -m flake8 lyo_app/ai_classroom/websocket_routes.py tests/test_web_classroom_resume_route.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_web_classroom_resume_route.py tests/test_adaptive_classroom_persistence.py
      - name: Evidence limit
        if: success()
        run: echo 'Source tests passed; authenticated 30-minute staging resume required before production.' >> "$GITHUB_STEP_SUMMARY"
