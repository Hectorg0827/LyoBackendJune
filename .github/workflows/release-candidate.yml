name: LYO backend release candidate

# Checks the single backend release candidate before it may go to production.
# It deploys nothing and reads no learner data.
on:
  push:
    branches: [ccr-3bc562fc-kn237t]
  workflow_dispatch:
    inputs:
      repeats:
        description: Times each labelled answer is graded
        required: true
        type: number
        default: 2

permissions:
  contents: read

concurrency:
  group: backend-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Backend regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visual_test
          POSTGRES_PASSWORD: visual_test
          POSTGRES_DB: visual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visual_test -d visual_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "true"
      SECRET_KEY: test-secret-key-for-classroom-ci-at-least-32-characters
      ENVIRONMENT: development
      CHAT_VISUAL_POSTGRES_URL: postgresql+asyncpg://visual_test:visual_test@localhost:5432/visual_test
      TEST_PREP_POSTGRES_URL: postgresql+asyncpg://visual_test:visual_test@localhost:5432/visual_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/requirements-rc.txt
          python -m pip install --ignore-installed packaging -r /tmp/requirements-rc.txt
          python -m pip install pytest pytest-asyncio
      - name: Full backend regression suite
        run: python -m pytest tests/ -q --ignore=tests/test_load.py

  grading-accuracy:
    name: Teacher grading accuracy (real AI grader)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTING: "true"
      SECRET_KEY: test-secret-key-for-classroom-ci-at-least-32-characters
      ENVIRONMENT: development
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REPEATS: ${{ inputs.repeats || 2 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require both provider keys before claiming grading readiness
        id: key
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Teacher grading accuracy was NOT measured. Configure both OPENAI_API_KEY and GEMINI_API_KEY as GitHub Actions repository secrets; then re-run this workflow."
            echo "### Teacher grading accuracy: BLOCKED — required AI provider secret(s) missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/requirements-rc.txt
          python -m pip install --ignore-installed packaging -r /tmp/requirements-rc.txt
      - name: Grade the labelled answer set with the real grader
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          python scripts/classroom_grading_acceptance.py --repeats "$REPEATS" \
            --output artifacts/teacher-quality/grading-acceptance.json
          code=$?
          {
            echo '### Teacher grading accuracy'
            echo '```json'
            python -c "import json;r=json.load(open('artifacts/teacher-quality/grading-acceptance.json'));print(json.dumps({'accepted':r['accepted'],'metrics':r['metrics'],'checks':r['checks'],'providers_configured':r['providers_configured']},indent=2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload grading report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grading-acceptance-${{ github.run_id }}
          path: artifacts/teacher-quality/grading-acceptance.json
          if-no-files-found: warn
          retention-days: 30
