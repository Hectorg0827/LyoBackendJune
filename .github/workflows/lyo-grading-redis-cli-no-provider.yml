name: LYO staging grader Redis lifecycle - no provider
on:
  push:
    branches: [fix/staging-grading-redis-init-20261122]
    paths:
      - 'scripts/classroom_grading_acceptance.py'
      - 'tests/test_classroom_grading_acceptance_harness.py'
      - '.github/workflows/lyo-grading-redis-cli-no-provider.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-cli-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-grading-redis-cli-no-provider-20261122
      CLASSROOM_AI_TRIAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile grading script and tests
        run: python -m py_compile scripts/classroom_grading_acceptance.py tests/test_classroom_grading_acceptance_harness.py
      - name: Install no-provider backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-grading-cli-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-grading-cli-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Ensure provider credentials are absent
        run: |
          test -z "${OPENAI_API_KEY:-}" && test -z "${GEMINI_API_KEY:-}" && test -z "${GOOGLE_API_KEY:-}"
      - name: Grade harness and Redis initialization tests (zero provider traffic)
        run: |
          python -m flake8 scripts/classroom_grading_acceptance.py tests/test_classroom_grading_acceptance_harness.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_classroom_grading_acceptance_harness.py tests/test_classroom_immediate_feedback.py tests/test_adaptive_classroom.py
      - name: Explicit release evidence boundary
        if: always()
        run: |
          echo 'This workflow exercises no-provider test fixtures only. Live 41-case double-pass (82 model evaluations) remains unverified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Redis ledger reset; no production deployment; no provider credentials used.' >> "$GITHUB_STEP_SUMMARY"
