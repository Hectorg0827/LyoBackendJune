name: Password Recovery Staging Read-only Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/password-reset-staging-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Railway backend health
        run: curl --fail --show-error --silent --location --max-time 25 https://lyojourneystagingbackend-staging.up.railway.app/health
      - name: Verify staging forgot password page
        run: curl --fail --show-error --silent --location --max-time 25 --output /dev/null https://lyoonestagingweb-staging.up.railway.app/auth/forgot-password
      - name: Verify staging reset password page
        run: curl --fail --show-error --silent --location --max-time 25 --output /dev/null https://lyoonestagingweb-staging.up.railway.app/auth/reset-password
      - name: Verify invalid token is rejected
        shell: bash
        run: |
          status=$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"token":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","new_password":"nonaccount-test-password123","confirm_password":"nonaccount-test-password123"}' \
            https://lyojourneystagingbackend-staging.up.railway.app/api/v1/auth/password-reset/confirm)
          test "$status" = "400"
      - name: Verify nonexistent test address returns generic or fail-closed response
        shell: bash
        run: |
          status=$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"email":"lyo-ci-nonexistent-20261016@example.org"}' \
            https://lyojourneystagingbackend-staging.up.railway.app/api/v1/auth/password-reset/request)
          test "$status" = "503" -o "$status" = "200"
          echo "Staging generic reset request HTTP $status (200 does not prove email delivery)"
