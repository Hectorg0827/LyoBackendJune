name: LYO staging AI trial ledger atomic fail-closed regression (no provider)
on:
  push:
    branches: [fix/staging-trial-ledger-fail-closed-atomic-20261122]
    paths:
      - 'lyo_app/ai_classroom/trial_budget.py'
      - 'tests/test_classroom_trial_budget.py'
      - 'tests/test_classroom_trial_budget_lua_integration.py'
      - '.github/workflows/lyo-trial-ledger-atomic-redis-ci.yml'
permissions:
  contents: read
jobs:
  atomic-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      CLASSROOM_AI_TRIAL_ENABLED: 'false'
      SECRET_KEY: lyo-local-redis-atomic-qa-no-paid-provider
      LYO_QA_LOCAL_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static syntax check
        run: python -m py_compile lyo_app/ai_classroom/trial_budget.py tests/test_classroom_trial_budget.py tests/test_classroom_trial_budget_lua_integration.py
      - name: Install backend QA dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-qa-redis-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-qa-redis-req.txt
          python -m pip install pytest pytest-asyncio flake8 redis
      - name: Prove provider credentials are absent
        run: |
          test -z "${OPENAI_API_KEY:-}" && test -z "${GEMINI_API_KEY:-}" && test -z "${GOOGLE_API_KEY:-}"
      - name: Python and actual Redis 8 atomic reservation verification
        run: |
          python -m flake8 lyo_app/ai_classroom/trial_budget.py tests/test_classroom_trial_budget.py tests/test_classroom_trial_budget_lua_integration.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_classroom_trial_budget.py tests/test_classroom_trial_budget_lua_integration.py tests/test_classroom_grading_acceptance_harness.py
      - name: Evidence boundaries
        if: always()
        run: |
          echo 'Tests used isolated local Redis 8, a unique synthetic qa:lyo:classroom:atomic key and no provider credentials.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No live staging ledger was touched. No 82-case paid benchmark was run. Production NO-GO.' >> "$GITHUB_STEP_SUMMARY"
