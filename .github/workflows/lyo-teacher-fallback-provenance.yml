name: LYO classroom model-vs-fallback provenance check
on:
  push:
    branches: [fix/lyo-teacher-fallback-provenance-20261122]
    paths:
      - 'lyo_app/ai_classroom/adaptive_session.py'
      - 'lyo_app/ai_classroom/scene_lifecycle_engine.py'
      - 'tests/test_web_teacher_fallback_provenance.py'
      - '.github/workflows/lyo-teacher-fallback-provenance.yml'
permissions:
  contents: read
jobs:
  scene-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-teacher-fallback-provenance-test-key-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile lyo_app/ai_classroom/adaptive_session.py lyo_app/ai_classroom/scene_lifecycle_engine.py tests/test_web_teacher_fallback_provenance.py
      - name: Install isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-teacher-provenance-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-teacher-provenance-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Verify non-model recovery attribution and existing saved-scene contracts
        run: |
          python -m flake8 lyo_app/ai_classroom/adaptive_session.py lyo_app/ai_classroom/scene_lifecycle_engine.py tests/test_web_teacher_fallback_provenance.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_web_teacher_fallback_provenance.py tests/test_web_fallback_scene_durability.py tests/test_web_classroom_resume_route.py
