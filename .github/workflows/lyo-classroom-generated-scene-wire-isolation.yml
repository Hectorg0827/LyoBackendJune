name: LYO staged Classroom generated-scene owner wire isolation
on:
  push:
    branches: [qa/staging-generated-scene-owner-wire-20261122]
    paths:
      - 'tests/test_classroom_ws_generated_scene_wire_isolation.py'
      - '.github/workflows/lyo-classroom-generated-scene-wire-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asgi-scene-owner-isolation:
    name: Real ASGI scene stream serialized to the right learner and devices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: no-provider-classroom-scene-wire-qa
      CLASSROOM_AI_TRIAL_ENABLED: 'false'
      OPENAI_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Syntax checks and backend test dependencies
        run: |
          python -m py_compile tests/test_classroom_ws_generated_scene_wire_isolation.py
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-scene-wire-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-scene-wire-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Execute real scene serialization + multi-learner room regression
        run: |
          python -m flake8 tests/test_classroom_ws_generated_scene_wire_isolation.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_classroom_ws_generated_scene_wire_isolation.py tests/test_classroom_ws_owner_rooms.py tests/test_classroom_ws_topic_continuity.py
      - name: Explicit evidence limit
        if: always()
        run: |
          echo 'Exercises actual Starlette WebSocket framing, manager queues and generated synthetic scene messages with two owners using same ID.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No model-generated text, real Railway WebSocket, paid AI or production system. Further live staging provider-driven scene proof remains open.' >> "$GITHUB_STEP_SUMMARY"
