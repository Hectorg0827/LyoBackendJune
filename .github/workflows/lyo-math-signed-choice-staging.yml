name: LYO signed mathematical-choice strict acceptance
on:
  push:
    branches: [fix/lyo-math-answer-label-normalization-20261122]
    paths:
      - 'lyo_app/ai_classroom/adaptive_teaching.py'
      - 'tests/test_web_math_signed_choice_labels.py'
      - '.github/workflows/lyo-math-signed-choice-staging.yml'
permissions:
  contents: read
jobs:
  strict-signed-choices:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-math-signed-choices-regression-secret-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source syntax
        run: python -m py_compile lyo_app/ai_classroom/adaptive_teaching.py tests/test_web_math_signed_choice_labels.py
      - name: Install isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-signed-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-signed-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Run signed mathematics and strict diagnostic regressions
        run: |
          python -m flake8 lyo_app/ai_classroom/adaptive_teaching.py tests/test_web_math_signed_choice_labels.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_web_math_signed_choice_labels.py tests/test_web_diagnostic_distinct_choice_repair.py tests/test_classroom_generation_contract.py
      - name: Evidence
        if: success()
        run: |
          echo 'Source checks passed: signs preserved, true duplicate options still rejected. Real provider grading remains a separate gate.' >> "$GITHUB_STEP_SUMMARY"
