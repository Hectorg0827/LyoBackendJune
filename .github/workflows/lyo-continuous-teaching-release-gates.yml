name: Continuous Teaching production release gates (no deploy)

on:
  push:
    branches: [rc/lyo-continuous-teaching-focused-backend-20261119]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-teaching-release-backend
  cancel-in-progress: true

jobs:
  production-policy:
    name: Production opt-in, auth allowlist and paid-usage safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: testing
      LYO_CONTINUOUS_TEACHING_STAGING: '0'
      LYO_CONTINUOUS_TEACHING_PRODUCTION_ENABLED: '0'
      LYO_CONTINUOUS_TEACHING_PRODUCTION_AI_ENABLED: '0'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated contract dependencies
        run: python -m pip install --disable-pip-version-check pytest "pydantic>=2.10,<2.11"
      - name: Compile changed production modules
        run: |
          python -m py_compile lyo_app/ai_classroom/continuous_teaching.py \
            lyo_app/ai_classroom/websocket_routes.py \
            tests/test_classroom_continuous_teaching.py
      - name: Execute fail-closed tests without real AI traffic
        run: |
          mkdir -p /tmp/lyo-release-contract
          cp tests/test_classroom_continuous_teaching.py /tmp/lyo-release-contract/test_bridge.py
          python - <<'PY'
          import pathlib
          import sys
          import types
          import pytest
          import lyo_app
          classroom = types.ModuleType("lyo_app.ai_classroom")
          classroom.__path__ = [str(pathlib.Path.cwd() / "lyo_app" / "ai_classroom")]
          sys.modules["lyo_app.ai_classroom"] = classroom
          raise SystemExit(pytest.main([
              "-q", "-c", "/dev/null", "/tmp/lyo-release-contract/test_bridge.py",
          ]))
          PY

  backend-regression:
    name: Full backend regression with production teacher disabled
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visual_test
          POSTGRES_PASSWORD: visual_test
          POSTGRES_DB: visual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visual_test -d visual_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: 'true'
      SECRET_KEY: test-secret-key-for-classroom-ci-at-least-32-characters
      ENVIRONMENT: development
      LYO_CONTINUOUS_TEACHING_STAGING: '0'
      LYO_CONTINUOUS_TEACHING_PRODUCTION_ENABLED: '0'
      LYO_CONTINUOUS_TEACHING_PRODUCTION_AI_ENABLED: '0'
      CHAT_VISUAL_POSTGRES_URL: postgresql+asyncpg://visual_test:visual_test@localhost:5432/visual_test
      TEST_PREP_POSTGRES_URL: postgresql+asyncpg://visual_test:visual_test@localhost:5432/visual_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing backend regression dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/requirements-lyo-release-ci.txt
          python -m pip install --ignore-installed packaging -r /tmp/requirements-lyo-release-ci.txt
          python -m pip install pytest pytest-asyncio
      - name: Full regression
        run: python -m pytest tests/ -q --ignore=tests/test_load.py
