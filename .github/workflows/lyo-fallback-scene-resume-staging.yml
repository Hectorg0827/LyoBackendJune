name: LYO no-state Classroom resume SQLite regression
on:
  push:
    branches: [fix/lyo-fallback-scene-durability-20261122]
    paths:
      - 'lyo_app/ai_classroom/scene_lifecycle_engine.py'
      - 'tests/test_web_fallback_scene_durability.py'
      - '.github/workflows/lyo-fallback-scene-resume-staging.yml'
permissions:
  contents: read
jobs:
  resume-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-fallback-scene-durable-sqlite-ci-secret-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile lyo_app/ai_classroom/scene_lifecycle_engine.py tests/test_web_fallback_scene_durability.py
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-fallback-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-fallback-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Validate exact fallback save/replay plus existing persistence regressions
        run: |
          python -m flake8 lyo_app/ai_classroom/scene_lifecycle_engine.py tests/test_web_fallback_scene_durability.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_web_fallback_scene_durability.py tests/test_adaptive_classroom_persistence.py tests/test_web_classroom_resume_route.py
