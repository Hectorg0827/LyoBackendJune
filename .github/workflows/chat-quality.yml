name: Chat quality validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lyo_app/chat/**"
      - "lyo_app/api/v1/chat_lyo2.py"
      - "lyo_app/api/v1/stream_lyo2.py"
      - "lyo_app/ai/executor.py"
      - "lyo_app/enhanced_main.py"
      - "lyo_app/ai_agents/multi_agent_v2/tools/web_search_tool.py"
      - "scripts/live_chat_quality.py"
      - ".github/workflows/chat-quality.yml"
  pull_request:
    paths:
      - "lyo_app/chat/**"
      - "lyo_app/api/v1/chat_lyo2.py"
      - "lyo_app/api/v1/stream_lyo2.py"
      - "lyo_app/ai/executor.py"
      - "tests/test_chat_companion_completion.py"
      - "tests/test_chat_companion_v2.py"
      - "tests/test_chat_fast_path.py"
      - "tests/test_chat_freshness.py"
      - "tests/test_fast_chat_grounding.py"
      - "tests/test_chat_canonical_persistence.py"
      - "tests/test_live_chat_quality.py"
      - "lyo_app/enhanced_main.py"
      - "lyo_app/ai_agents/multi_agent_v2/tools/web_search_tool.py"
      - "scripts/live_chat_quality.py"
      - ".github/workflows/chat-quality.yml"

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r requirements.txt
      - name: Run canonical Chat regression matrix
        env:
          LYO_LIGHTWEIGHT_STARTUP: "1"
        run: |
          python -m pytest -q \
            tests/test_chat_companion_completion.py tests/test_chat_companion_v2.py \
            tests/test_chat_fast_path.py tests/test_chat_freshness.py tests/test_fast_chat_grounding.py \
            tests/test_chat_multimodal.py tests/test_chat_canonical_persistence.py \
            tests/test_live_search.py tests/test_current_information_stream.py \
            tests/test_live_chat_quality.py tests/test_voice_contract.py \
            tests/test_voice_turn_lifecycle.py tests/test_teaching_runtime_model_router.py

  production:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - name: Run deployed canonical Chat matrix
        env:
          LYO_CHAT_QUALITY_TOKEN: ${{ secrets.LYO_CHAT_QUALITY_TOKEN }}
          LYO_TEACHER_QUALITY_TOKEN: ${{ secrets.LYO_TEACHER_QUALITY_TOKEN }}
          LYO_BASE_URL: https://api.lyoai.app
          LYO_EXPECTED_DEPLOYED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            result=0
            python scripts/live_chat_quality.py || result=$?
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$result" -eq 2 ]; then
              echo "Production validation requires an accepted test learner token. See the saved report."
              exit 2
            fi
            echo "Production quality attempt ${attempt} did not pass yet; deployment may still be converging."
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-quality-report
          path: artifacts/chat-quality/live-chat-quality.json
          retention-days: 30
