name: Lyo One live Classroom provider rehearsal (isolated)

# Deliberately opt-in. No production URL or account and no model API secret
# is injected by GitHub. Provision a provider key in isolated Railway staging
# before confirming readiness by manual dispatch or the trusted PR label.
on:
  workflow_dispatch:
    inputs:
      provider_staging_ready:
        description: 'Confirm isolated Railway staging has a working AI model provider (type yes)'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
      scenario:
        required: true
        default: math_fractions
        type: choice
        options: [math_fractions, biology_photosynthesis, physics_newton2, spanish_past_tense, business_contribution_margin]
      profile:
        required: true
        default: struggling
        type: choice
        options: [struggling, beginner, interrupter, confident_wrong, curious, advanced]

  # GitHub only exposes workflow_dispatch from default-branch workflows.
  # A maintainer can validate this stacked draft before merge by applying
  # the 'lyo-provider-ready' label to the trusted backend PR #136.
  pull_request:
    types: [labeled]
    branches: [feature/lyo-one-journey-context]

permissions:
  contents: read

concurrency:
  group: lyo-one-live-classroom-isolated
  cancel-in-progress: false

jobs:
  provider-backed-teacher:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYO_ONE_EXPECTED_BACKEND_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LYO_ONE_PROVIDER_STAGING_READY: ${{ inputs.provider_staging_ready }}
      LYO_ONE_CLASSROOM_SCENARIO: ${{ inputs.scenario }}
      LYO_ONE_CLASSROOM_PROFILE: ${{ inputs.profile }}
      LYO_ONE_CLASSROOM_ONLY: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require explicit staging provider readiness
        shell: bash
        run: |
          if [ "$LYO_ONE_PROVIDER_STAGING_READY" != "yes" ]; then
            echo "::error::Isolated staging has no validated model provider. Configure it and confirm yes before this run."
            exit 2
          fi
      - name: Install black-box teaching harness dependencies
        run: python -m pip install --disable-pip-version-check httpx websockets
      - name: Verify isolated host protection and synthetic learner setup
        run: python -m unittest discover -s tests -p test_lyo_one_live_classroom_runner.py
      - name: Run real Classroom scenes and verify evidence
        run: python scripts/validate_lyo_one_live_classroom.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyo-one-live-classroom-${{ inputs.scenario }}-${{ github.run_id }}
          path: artifacts/lyo-one-classroom/*.json
          if-no-files-found: ignore
          retention-days: 14

  provider-backed-premerge:
    # Staging-only, explicit maintainer opt-in. Never run for unrelated or
    # forked PRs; workflows checked out from a PR are executable code.
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'lyo-provider-ready' && github.event.pull_request.number == 136 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Model-overload failures under parallel synthetic traffic are not a
      # fair proof of pedagogical reliability. Keep staging provider checks
      # sequential until steady-state capacity is separately load-tested.
      max-parallel: 1
      matrix:
        include:
          - scenario: math_fractions
            profile: struggling
          - scenario: biology_photosynthesis
            profile: interrupter
          - scenario: spanish_past_tense
            profile: curious
          - scenario: physics_newton2
            profile: confident_wrong
    env:
      LYO_ONE_EXPECTED_BACKEND_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LYO_ONE_PROVIDER_STAGING_READY: 'yes'
      LYO_ONE_CLASSROOM_SCENARIO: ${{ matrix.scenario }}
      LYO_ONE_CLASSROOM_PROFILE: ${{ matrix.profile }}
      LYO_ONE_CLASSROOM_ONLY: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Classroom harness dependencies
        run: python -m pip install --disable-pip-version-check httpx websockets
      - name: Verify hard-pinned isolated host and synthetic learner safety
        run: python -m unittest discover -s tests -p test_lyo_one_live_classroom_runner.py
      - name: Run provider-backed teaching and persisted-evidence gate
        run: python scripts/validate_lyo_one_live_classroom.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyo-one-premerge-${{ matrix.scenario }}-${{ github.run_id }}
          path: artifacts/lyo-one-classroom/*.json
          if-no-files-found: ignore
          retention-days: 14

  provider-cost-benchmark:
    # One opt-in scenario to measure actual provider cost after prompt
    # compaction; never conflate a cheaper response with mastered learning.
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'lyo-cost-ready' && github.event.pull_request.number == 136 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYO_ONE_EXPECTED_BACKEND_SHA: ${{ github.event.pull_request.head.sha }}
      LYO_ONE_PROVIDER_STAGING_READY: 'yes'
      LYO_ONE_CLASSROOM_SCENARIO: physics_newton2
      LYO_ONE_CLASSROOM_PROFILE: confident_wrong
      LYO_ONE_CLASSROOM_ONLY: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Classroom benchmark dependencies
        run: python -m pip install --disable-pip-version-check httpx websockets
      - name: Guard staging-only target and candidate revision
        run: python -m unittest discover -s tests -p test_lyo_one_live_classroom_runner.py
      - name: Record actual authored teaching and persisted evidence
        run: python scripts/validate_lyo_one_live_classroom.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyo-classroom-cost-physics-${{ github.run_id }}
          path: artifacts/lyo-one-classroom/*.json
          if-no-files-found: ignore
          retention-days: 14
