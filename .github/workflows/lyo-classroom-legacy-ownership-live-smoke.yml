name: LYO Classroom legacy session ownership live staging smoke

on:
  push:
    branches:
      - rc/lyo-continuous-teaching-focused-backend-20261119
    paths:
      - scripts/continuous_teaching_legacy_ownership_live_smoke.py
      - .github/workflows/lyo-classroom-legacy-ownership-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyo-legacy-session-ownership-smoke
  cancel-in-progress: false

jobs:
  staging-ownership:
    name: Verify anonymous denial, cross-user denial, and owner access on preview only
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded external probe dependencies
        run: python -m pip install --disable-pip-version-check httpx==0.28.1 websockets==15.0.1
      - name: Enforce pinned staging host and verify legacy session ownership
        env:
          LYO_STAGING_SMOKE_URL: https://lyo-continuousteaching-preview-backend-staging.up.railway.app
        run: python -u scripts/continuous_teaching_legacy_ownership_live_smoke.py
