name: LYO authenticated course persistence staging gate
# Source-only backend checks; never deploys or calls AI providers.
on:
  push:
    branches: [fix/lyo-course-persistence-20261122]
    paths:
      - 'lyo_app/learning/routes.py'
      - 'tests/test_web_course_persistence_contract.py'
      - '.github/workflows/lyo-course-persistence-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: course-persistence-test-secret-minimum-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Compile backend course route and focused tests
        run: python -m py_compile lyo_app/learning/routes.py tests/test_web_course_persistence_contract.py
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/course-persistence-requirements.txt
          python -m pip install --ignore-installed packaging -r /tmp/course-persistence-requirements.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Check syntax and undefined symbols
        run: python -m flake8 lyo_app/learning/routes.py tests/test_web_course_persistence_contract.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Validate database failure, real lesson save, cross-user denial
        run: python -m pytest -q tests/test_web_course_persistence_contract.py
      - name: Evidence boundary
        if: success()
        run: |
          echo 'PASS: source-level behavior tests for atomic ownership and failure contracts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not a substitute for authenticated staging database read-after-write.' >> "$GITHUB_STEP_SUMMARY"
