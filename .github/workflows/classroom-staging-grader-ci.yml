name: Classroom written-grader staging regression

on:
  push:
    branches:
      - fix/staging-classroom-written-grading-20261103
      - fix/staging-classroom-start-provider-fallback-20261103
      - fix/staging-teacher-quality-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  written-grader:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visual_test
          POSTGRES_PASSWORD: visual_test
          POSTGRES_DB: visual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visual_test -d visual_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "true"
      SECRET_KEY: test-secret-key-for-classroom-ci-at-least-32-characters
      ENVIRONMENT: development
      CHAT_VISUAL_POSTGRES_URL: postgresql+asyncpg://visual_test:visual_test@localhost:5432/visual_test
      TEST_PREP_POSTGRES_URL: postgresql+asyncpg://visual_test:visual_test@localhost:5432/visual_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/requirements-classroom.txt
          python -m pip install --ignore-installed packaging -r /tmp/requirements-classroom.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Syntax and imports
        run: |
          python -m compileall -q lyo_app/ai_classroom/adaptive_teaching.py lyo_app/ai_classroom/adaptive_session.py lyo_app/ai_classroom/teaching_prompt.py tests/test_classroom_semantic_content_gate.py lyo_app/ai_classroom/fraction_grading.py lyo_app/core/ai_resilience.py tests/test_classroom_fraction_grading.py tests/test_classroom_staging_grader_failover.py tests/test_gemini_auth_headers.py tests/test_community_following_posts.py
          python -m flake8 lyo_app/ai_classroom/adaptive_teaching.py lyo_app/ai_classroom/fraction_grading.py lyo_app/core/ai_resilience.py tests/test_classroom_fraction_grading.py tests/test_classroom_staging_grader_failover.py tests/test_gemini_auth_headers.py tests/test_community_following_posts.py --select=E9,F63,F7,F82 --show-source --statistics
      - name: Grading and recovery regression tests
        run: |
          python -m pytest -q \
            tests/test_classroom_fraction_grading.py \
            tests/test_classroom_semantic_content_gate.py \
            tests/test_staging_teacher_quality_workflow.py \
            tests/test_staging_teacher_quality_gate.py \
            tests/test_classroom_staging_grader_failover.py \
            tests/test_classroom_generation_contract.py \
            tests/test_classroom_recovery.py \
            tests/test_model_escalation.py \
            tests/test_gemini_auth_headers.py \
            tests/test_community_following_posts.py
      - name: Classroom lesson state machine tests
        run: |
          python -m pytest -q tests/test_adaptive_classroom.py tests/test_ai_classroom_teaching_loop.py
