name: LYO diagnostic distinct-options fail-closed regression
on:
  push:
    branches: [fix/lyo-diagnostic-distinct-choices-20261122]
    paths:
      - 'lyo_app/ai_classroom/adaptive_teaching.py'
      - 'tests/test_web_diagnostic_distinct_choice_repair.py'
      - '.github/workflows/lyo-diagnostic-options-staging.yml'
permissions:
  contents: read
jobs:
  valid-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-diagnostic-options-staging-tests-32-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile lyo_app/ai_classroom/adaptive_teaching.py tests/test_web_diagnostic_distinct_choice_repair.py
      - name: Install backend dependencies without invoking providers
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-distinct-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-distinct-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Validate targeted repair and existing teaching contracts
        run: |
          python -m flake8 lyo_app/ai_classroom/adaptive_teaching.py tests/test_web_diagnostic_distinct_choice_repair.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_web_diagnostic_distinct_choice_repair.py tests/test_classroom_generation_contract.py
      - name: Honest evidence limit
        if: success()
        run: echo 'Source-only bounded prompt repair passed; real provider-backed grading requires fresh staging retest.' >> "$GITHUB_STEP_SUMMARY"
