name: LYO grading accuracy 41-case completeness + feedback regression
on:
  push:
    branches: [qa/lyo-grading-coverage-20261122]
    paths:
      - 'scripts/classroom_grading_acceptance.py'
      - 'tests/test_classroom_grading_acceptance_harness.py'
      - 'tests/test_classroom_immediate_feedback.py'
      - 'tests/test_adaptive_classroom.py'
      - '.github/workflows/lyo-grading-41-completeness.yml'
permissions:
  contents: read
jobs:
  no-provider-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-grading-41-full-matrix-no-provider-tests-32
      CLASSROOM_AI_TRIAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source syntax
        run: |
          python -m py_compile scripts/classroom_grading_acceptance.py tests/test_classroom_grading_acceptance_harness.py
      - name: Install backend test dependencies (without provider credentials)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-grading-41-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-grading-41-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Ensure no accidental live provider secrets in this job
        run: |
          test -z "${OPENAI_API_KEY:-}" && test -z "${GEMINI_API_KEY:-}" && test -z "${GOOGLE_API_KEY:-}"
      - name: Enforce full double-pass 41-answer coverage and regression invariants
        run: |
          python -m flake8 scripts/classroom_grading_acceptance.py tests/test_classroom_grading_acceptance_harness.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_classroom_grading_acceptance_harness.py tests/test_classroom_immediate_feedback.py tests/test_adaptive_classroom.py
      - name: Report evidence boundary
        if: success()
        run: |
          echo 'No-provider scoring and feedback regression passed; the 41-case live-model grading release gate has NOT been run here.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No credits spent; production remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
