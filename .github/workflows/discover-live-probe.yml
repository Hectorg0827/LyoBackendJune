name: Discover live probe

# Read-only checks against production, from a runner that can reach it:
# which commit api.lyoai.app and lyoai.app are serving, and whether the media
# route answers HEAD (405 before the Discover media fix, 404 for a missing
# file after it), and whether each web address serves Discover switched on.
# Changes nothing. The last step signs in as the library account, when its
# secrets are set, to read the Discover feed a user would get.
on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/discover-live-probe.yml
      # Publishing the library needs the Discover backend live, so every
      # change to its manifest re-reads what production serves.
      - catalog/catalog.json
      - catalog/serving_check.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Backend health
        run: curl -sS -m 30 https://api.lyoai.app/health | tee -a "$GITHUB_STEP_SUMMARY"; echo

      - name: Web health on both hostnames
        # The Railway web service answers www.lyoai.app; the apex may be served
        # by something else, which a deploy of that service does not update.
        run: |
          for host in lyoai.app www.lyoai.app; do
            echo "$host: $(curl -sS -m 30 "https://$host/api/health")" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Discover switch on both hostnames
        # /discover is prerendered: switched on, it holds the feed's loading
        # placeholder; switched off, the "being updated" notice.
        run: |
          for host in www.lyoai.app lyoai.app; do
            page=$(curl -sS -m 30 -L "https://$host/discover" || true)
            if grep -q 'Loading Discover' <<<"$page"; then state=on
            elif grep -q 'Discover is being updated' <<<"$page"; then state=off
            else state="unknown (neither marker found)"
            fi
            echo "$host/discover -> $state" | tee -a "$GITHUB_STEP_SUMMARY"
            # The report sheet ships in the Discover page's own script.
            chunk=$(grep -oE '/_next/static/chunks/app/[^"]*discover/page-[^"]*\.js' <<<"$page" | head -1)
            if [ -n "$chunk" ] && curl -sS -m 30 "https://$host$chunk" | grep -q 'Send report'; then report=yes; else report=no; fi
            echo "$host/discover report button -> $report" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Where each hostname points
        run: |
          for host in lyoai.app www.lyoai.app api.lyoai.app; do
            echo "$host -> $(dig +short "$host" | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          curl -sS -m 30 -o /dev/null -D - https://lyoai.app/ | grep -iE '^(HTTP|server|location|x-railway|x-vercel)' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The API accepts the website on both hostnames
        # lyoai.app forwards to www.lyoai.app, so the API must allow www.
        run: |
          for origin in https://www.lyoai.app https://lyoai.app; do
            allowed=$(curl -sS -m 30 -o /dev/null -D - -X OPTIONS https://api.lyoai.app/api/v1/clips/discover \
              -H "Origin: $origin" -H "Access-Control-Request-Method: GET" \
              -H "Access-Control-Request-Headers: authorization" \
              | grep -i '^access-control-allow-origin' | tr -d '\r')
            echo "$origin -> ${allowed:-not allowed}" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: A video over 10 MB reaches the upload route
        # 413 means a blanket size cap refused it before the route; 401 means
        # it got through to the route, which then asks for a sign-in.
        run: |
          head -c $((11 * 1024 * 1024)) /dev/zero > "$RUNNER_TEMP/eleven-mb.mp4"
          code=$(curl -sS -m 120 -o /dev/null -w '%{http_code}' \
            -F "folder=clips" -F "file=@$RUNNER_TEMP/eleven-mb.mp4;type=video/mp4" \
            https://api.lyoai.app/api/v1/media/upload)
          echo "11 MB upload without a sign-in -> $code (413 = refused for size; 401 = reached the route)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Videos can be reported
        # 401 means the report route exists and asks for a sign-in; 404 means
        # the API predates it.
        run: |
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"reason":"other"}' \
            https://api.lyoai.app/api/v1/clips/1/report)
          echo "Report without a sign-in -> $code (401 = route live; 404 = not deployed)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Moderation is live
        # The API's moderator routes ask for a sign-in (401; 404 = not
        # deployed), and each web address serves the /moderation page.
        run: |
          for path in moderation/me moderation/clips; do
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "https://api.lyoai.app/api/v1/$path")
            echo "GET /api/v1/$path without a sign-in -> $code (401 = route live; 404 = not deployed)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # A web deploy may still be rolling out, so wait up to 20 minutes.
          for host in www.lyoai.app lyoai.app; do
            shipped=no
            for attempt in $(seq 40); do
              page=$(curl -sS -m 30 -L "https://$host/moderation" || true)
              chunk=$(grep -oE '/_next/static/chunks/app/[^"]*moderation/page-[^"]*\.js' <<<"$page" | head -1)
              if [ -n "$chunk" ] && curl -sS -m 30 "https://$host$chunk" | grep -q 'This page is for moderators'; then shipped=yes; break; fi
              sleep 30
            done
            echo "$host/moderation page -> $shipped" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Block is live
        # The API's block list asks for a sign-in (401; 404 = not deployed).
        # Discover ships Block inside its report sheet and Settings lists
        # blocked accounts; a web deploy may still be rolling out, so wait.
        run: |
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' https://api.lyoai.app/api/v1/community/blocks)
          echo "GET /api/v1/community/blocks without a sign-in -> $code (401 = route live)" | tee -a "$GITHUB_STEP_SUMMARY"
          shipped() {
            page=$(curl -sS -m 30 -L "https://$1/$2" || true)
            chunk=$(grep -oE "/_next/static/chunks/app/[^\"]*$2/page-[^\"]*\.js" <<<"$page" | head -1)
            [ -n "$chunk" ] && curl -sS -m 30 "https://$1$chunk" | grep -q "$3"
          }
          for host in www.lyoai.app lyoai.app; do
            block=no
            for attempt in $(seq 40); do
              if shipped "$host" discover 'unblock them in Settings'; then block=yes; break; fi
              sleep 30
            done
            if shipped "$host" settings 'Blocked accounts'; then list=yes; else list=no; fi
            echo "$host/discover Block -> $block; $host/settings Blocked accounts -> $list" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Password reset is live
        # A made-up link is refused (400 with the reset's own message; 404 =
        # not deployed). No email is sent and nothing changes. The website
        # ships Forgot password? on login and the page that asks for a link.
        run: |
          answer=$(curl -sS -m 30 -X POST -H 'Content-Type: application/json' \
            -d '{"token":"probe-not-a-real-link-0000000000","new_password":"Probe-Only-Pass9"}' \
            -w ' -> %{http_code}' https://api.lyoai.app/auth/password-reset/confirm)
          echo "POST /auth/password-reset/confirm with a made-up link: $answer" | tee -a "$GITHUB_STEP_SUMMARY"
          shipped() {
            page=$(curl -sS -m 30 -L "https://$1/$2" || true)
            chunk=$(grep -oE "/_next/static/chunks/app/[^\"]*$2/page-[^\"]*\.js" <<<"$page" | head -1)
            [ -n "$chunk" ] && curl -sS -m 30 "https://$1$chunk" | grep -q "$3"
          }
          for host in www.lyoai.app lyoai.app; do
            forgot=no
            for attempt in $(seq 40); do
              if shipped "$host" auth/forgot-password 'Send reset link'; then forgot=yes; break; fi
              sleep 30
            done
            if shipped "$host" auth/login 'Forgot password?'; then login=yes; else login=no; fi
            if shipped "$host" auth/reset-password 'Save new password'; then reset=yes; else reset=no; fi
            echo "$host forgot-password page -> $forgot; login link -> $login; reset page -> $reset" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Media route answers HEAD
        run: |
          missing="https://api.lyoai.app/api/v1/media/file/clips/$(printf '0%.0s' {1..32}).mp4"
          head=$(curl -sS -m 30 -I -o /dev/null -w '%{http_code}' "$missing")
          get=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$missing")
          echo "HEAD missing clip -> $head; GET missing clip -> $get" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The Discover feed a signed-in user gets
        env:
          DISCOVER_CERTIFY_EMAIL: ${{ secrets.DISCOVER_LIBRARY_EMAIL }}
          DISCOVER_CERTIFY_PASSWORD: ${{ secrets.DISCOVER_LIBRARY_PASSWORD }}
        run: |
          if [ -z "$DISCOVER_CERTIFY_EMAIL" ]; then
            echo "No library account secrets; feed not read." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pip install -q 'httpx==0.25.2'
          python catalog/serving_check.py | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
