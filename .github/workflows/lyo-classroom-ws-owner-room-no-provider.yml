name: LYO staging WebSocket authenticated-room isolation
on:
  push:
    branches: [fix/staging-classroom-ws-room-isolation-20261122]
    paths:
      - 'lyo_app/ai_classroom/websocket_manager.py'
      - 'lyo_app/ai_classroom/scene_lifecycle_engine.py'
      - 'tests/test_classroom_ws_owner_rooms.py'
      - 'tests/test_classroom_immediate_feedback.py'
      - 'tests/test_adaptive_classroom_persistence.py'
      - '.github/workflows/lyo-classroom-ws-owner-room-no-provider.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ws-owner-boundary:
    name: No-provider two-learner same-session-ID isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-websocket-room-qa-no-provider
      CLASSROOM_AI_TRIAL_ENABLED: 'false'
      OPENAI_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and selected static checks
        run: |
          python -m py_compile lyo_app/ai_classroom/websocket_manager.py lyo_app/ai_classroom/scene_lifecycle_engine.py tests/test_classroom_ws_owner_rooms.py
      - name: Install no-provider test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-ws-owner-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-ws-owner-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Verify user-scoped room lifecycle, broadcasts and existing recovery
        run: |
          python -m flake8 lyo_app/ai_classroom/websocket_manager.py lyo_app/ai_classroom/scene_lifecycle_engine.py tests/test_classroom_ws_owner_rooms.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q \
            tests/test_classroom_ws_owner_rooms.py \
            tests/test_classroom_immediate_feedback.py \
            tests/test_classroom_recovery.py \
            tests/test_classroom_ws_topic_continuity.py \
            tests/test_classroom_heartbeat.py \
            tests/test_guided_teaching_sequence.py \
            tests/test_adaptive_classroom_persistence.py
      - name: Evidence boundary
        if: always()
        run: |
          echo 'No real learners, physical voice, paid model, Redis ledger reset, or production change.' >> "$GITHUB_STEP_SUMMARY"
          echo 'In-process cross-learner room regression is not authenticated live two-account WebSocket end-to-end proof.' >> "$GITHUB_STEP_SUMMARY"
