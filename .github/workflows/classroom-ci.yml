name: AI Classroom PR

on:
  pull_request:
    branches: [main]
    paths:
      - "lyo_app/ai_classroom/**"
      - "lyo_app/chat/visuals.py"
      - "lyo_app/api/v1/stream_lyo2.py"
      - "tests/test_*classroom*.py"
      - "tests/test_chat_visual_storage.py"
      - "tests/test_interactive_fraction_pie.py"
      - "tests/adaptive_fixtures.py"
      - ".github/workflows/classroom-ci.yml"

permissions:
  contents: read

jobs:
  classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visual_test
          POSTGRES_PASSWORD: visual_test
          POSTGRES_DB: visual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visual_test -d visual_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "true"
      SECRET_KEY: test-secret-key-for-classroom-ci-at-least-32-characters
      ENVIRONMENT: development
      CHAT_VISUAL_POSTGRES_URL: postgresql+asyncpg://visual_test:visual_test@localhost:5432/visual_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/requirements-classroom.txt
          python -m pip install --ignore-installed packaging -r /tmp/requirements-classroom.txt
          python -m pip install pytest pytest-asyncio flake8

      - name: Syntax and undefined-name checks
        run: |
          python -m flake8             lyo_app/ai_classroom/adaptive_teaching.py             lyo_app/ai_classroom/adaptive_session.py             lyo_app/ai_classroom/teaching_prompt.py             lyo_app/ai_classroom/teaching_visuals.py             lyo_app/ai_classroom/scene_lifecycle_engine.py             tests/test_classroom_teacher_experience.py             tests/test_classroom_visual_teaching.py             --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Focused classroom tests
        run: |
          python -m pytest -q             tests/test_classroom_teacher_experience.py             tests/test_classroom_visual_teaching.py             tests/test_adaptive_classroom.py             tests/test_ai_classroom_teaching_loop.py             tests/test_classroom_recovery.py             tests/test_classroom_unit_packages.py

      - name: Backend regression suite
        run: python -m pytest tests/ -q --ignore=tests/test_load.py
