name: LYO authorized cumulative $70 Classroom trial guard
on:
  push:
    branches: [fix/lyo-teacher-70usd-trial-20261122]
    paths:
      - 'lyo_app/ai_classroom/trial_budget.py'
      - 'tests/test_classroom_trial_budget.py'
      - '.github/workflows/lyo-classroom-trial-70-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unchanged-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-staging-budget-70-guard-tests-secret-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and conservative spending guards
        run: python -m py_compile lyo_app/ai_classroom/trial_budget.py tests/test_classroom_trial_budget.py
      - name: Install test-only dependencies (no provider requests)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-budget-70-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-budget-70-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Prove no ledger reset and atomic strict cumulative $70 bound
        run: |
          python -m flake8 lyo_app/ai_classroom/trial_budget.py tests/test_classroom_trial_budget.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_classroom_trial_budget.py tests/test_web_teacher_budget_failfast.py
      - name: Evidence boundary
        if: success()
        run: |
          echo 'Source-level trial guard PASSED. Existing Redis reservations were simulated, not reset.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual staging Redis and provider auth remain separate gates; no production change.' >> "$GITHUB_STEP_SUMMARY"
