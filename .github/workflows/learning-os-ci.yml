name: Learning OS Runtime

on:
  pull_request:
    branches:
      - main
      - course-generation-events-20261001
    paths:
      - "lyo_app/teaching_runtime/**"
      - "lyo_app/ai/executor.py"
      - "lyo_app/api/v1/chat_lyo2.py"
      - "lyo_app/api/v1/stream_lyo2.py"
      - "lyo_app/ai_classroom/adaptive_session.py"
      - "lyo_app/ai_classroom/sdui_models.py"
      - "tests/test_teaching_runtime_policy.py"
      - ".github/workflows/learning-os-ci.yml"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTING: "true"
      SECRET_KEY: test-secret-key-for-learning-os-ci-at-least-32-characters
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/requirements-learning-os.txt
          python -m pip install --ignore-installed packaging -r /tmp/requirements-learning-os.txt
          python -m pip install pytest pytest-asyncio flake8

      - name: Syntax and undefined-name checks
        run: |
          python -m flake8             lyo_app/teaching_runtime             lyo_app/ai/executor.py             lyo_app/api/v1/chat_lyo2.py             lyo_app/api/v1/stream_lyo2.py             lyo_app/ai_classroom/adaptive_session.py             lyo_app/ai_classroom/sdui_models.py             tests/test_teaching_runtime_policy.py             --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Teaching policy contract
        run: python -m pytest -q tests/test_teaching_runtime_policy.py

      - name: Cross-surface learning regressions
        run: |
          python -m pytest -q             tests/test_chat_check_grading.py             tests/test_chat_continuity.py             tests/test_classroom_teacher_experience.py             tests/test_ai_classroom_teaching_loop.py             tests/test_classroom_emits_evidence.py             tests/test_evidence_ladder.py

      - name: Backend regression suite
        run: python -m pytest tests/ -q --ignore=tests/test_load.py
