name: LYO grading ledger preflight - no provider
on:
  push:
    branches: [qa/staging-grading-ledger-preflight-20261122]
    paths:
      - 'scripts/classroom_grading_acceptance.py'
      - 'tests/test_classroom_grading_acceptance_harness.py'
      - '.github/workflows/lyo-grading-ledger-preflight-no-provider.yml'
permissions:
  contents: read
jobs:
  ledger-preflight-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: lyo-ledger-preflight-no-provider-tests
      CLASSROOM_AI_TRIAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m py_compile scripts/classroom_grading_acceptance.py tests/test_classroom_grading_acceptance_harness.py
      - name: Install backend test requirements without provider secrets
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-ledger-test-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-ledger-test-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Confirm no model provider keys are supplied
        run: |
          test -z "${OPENAI_API_KEY:-}" && test -z "${GEMINI_API_KEY:-}" && test -z "${GOOGLE_API_KEY:-}"
      - name: Verify non-mutating ledger preflight, benchmark regressions and fail-closed behavior
        run: |
          python -m flake8 scripts/classroom_grading_acceptance.py tests/test_classroom_grading_acceptance_harness.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_classroom_grading_acceptance_harness.py tests/test_classroom_immediate_feedback.py tests/test_adaptive_classroom.py
      - name: Explicit evidence limit
        if: always()
        run: |
          echo 'No provider calls, no live Redis connection and no 82-case model benchmark occurred in this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The staging-only ledger preflight must be run inside the existing private Railway network before any billable acceptance run.' >> "$GITHUB_STEP_SUMMARY"
