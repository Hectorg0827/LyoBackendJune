name: LYO Live AI Teacher budget denial staging gate

on:
  push:
    branches: [fix/lyo-teacher-budget-failfast-20261122]
    paths:
      - 'lyo_app/ai_classroom/adaptive_teaching.py'
      - 'tests/test_web_teacher_budget_failfast.py'
      - '.github/workflows/lyo-live-teacher-budget-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENVIRONMENT: development
      TESTING: 'true'
      SECRET_KEY: lyo-live-teacher-budget-regression-secret-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax and undefined names
        run: |
          python -m py_compile lyo_app/ai_classroom/adaptive_teaching.py tests/test_web_teacher_budget_failfast.py
      - name: Install backend test dependencies (no provider)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/teacher-budget-req.txt
          python -m pip install --ignore-installed packaging -r /tmp/teacher-budget-req.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Verify budget denial never repeats requests
        run: |
          python -m flake8 lyo_app/ai_classroom/adaptive_teaching.py tests/test_web_teacher_budget_failfast.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_web_teacher_budget_failfast.py
      - name: Record limitation
        if: success()
        run: echo 'Source-only budget behavior passed, not a live AI response or spending authorization.' >> "$GITHUB_STEP_SUMMARY"
