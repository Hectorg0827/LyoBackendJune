name: LYO staging course completion integrity
# Focused backend PR validation only. No deploy, migration or provider calls.
on:
  push:
    branches: [fix/web-course-completion-staging-20261120, fix/course-json-budget-20261120, fix/course-status-no-redundant-ai-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  course-integrity:
    name: Python syntax, course contract and fail-closed stream
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TESTING: 'true'
      ENVIRONMENT: development
      SECRET_KEY: web-course-integrity-test-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check Python syntax before package installation
        run: python -m py_compile lyo_app/api/v1/stream_lyo2.py lyo_app/ai/executor.py tests/test_course_generation_stream_contract.py
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^[[:space:]]*moviepy([<=>~!].*)?$' requirements.txt > /tmp/lyo-course-qa-requirements.txt
          python -m pip install --ignore-installed packaging -r /tmp/lyo-course-qa-requirements.txt
          python -m pip install pytest pytest-asyncio flake8
      - name: Focused course fallback and grading invariants
        run: |
          python -m flake8 lyo_app/api/v1/stream_lyo2.py lyo_app/ai/executor.py tests/test_course_generation_stream_contract.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m pytest -q tests/test_course_generation_stream_contract.py tests/test_chat_check_grading.py tests/test_course_rendering.py
      - name: Record staging-only evidence
        if: success()
        run: |
          echo 'Failed course generation cannot fabricate a course or an open_classroom success. Test-only staging branch; no deployments.' >> "$GITHUB_STEP_SUMMARY"
