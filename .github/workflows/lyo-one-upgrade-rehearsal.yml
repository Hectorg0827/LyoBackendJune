name: Lyo One existing-schema migration rehearsal

on:
  pull_request:
    branches: [main, feature/lyo-one-journey-context]
    paths:
      - alembic/versions/coach_002_learning_journeys.py
      - alembic/versions/coach_003_default_tenant_bootstrap.py
      - alembic/versions/auth_epoch_001_password_reset_session_revocation.py
      - alembic/versions/auth_refresh_token_text_001_expand_token.py
      - alembic/versions/launch_001_merge_auth_and_coach.py
      - alembic/versions/launch_002_durable_course_compat.py
      - alembic/versions/launch_003_backfill_course_storage.py
      - alembic/versions/launch_004_legacy_chat_schema.py
      - lyo_app/coach/journey_models.py
      - lyo_app/coach/journey_schemas.py
      - lyo_app/coach/journeys.py
      - .github/workflows/lyo-one-upgrade-rehearsal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-existing-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: lyoapp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/lyoapp_test
      TESTING: "true"
      ENVIRONMENT: development
      SECRET_KEY: isolated-migration-rehearsal-not-production-xxxxxxxx
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install candidate dependencies
        run: |
          python -m pip install --disable-pip-version-check -r candidate/requirements.txt
      - name: Initialize schema with current main migrations
        working-directory: baseline
        env:
          PYTHONPATH: .
        run: alembic upgrade heads
      - name: Seed an existing learner, exam, plan and session before upgrade
        working-directory: baseline
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              db = await asyncpg.connect("postgresql://testuser:testpassword@localhost:5432/lyoapp_test")
              try:
                  async with db.transaction():
                      uid = await db.fetchval("""
                          INSERT INTO users (
                              email, username, hashed_password, is_active,
                              is_verified, is_superuser, created_at, updated_at
                          ) VALUES (
                              'preupgrade-learner@example.com', 'preupgrade_learner',
                              'synthetic-not-a-login', TRUE, FALSE, FALSE, NOW(), NOW()
                          ) RETURNING id
                      """)
                      await db.execute("""
                          INSERT INTO test_profiles (
                              id, user_id, created_at, subject, test_date, topics,
                              materials, intake_complete, intake_transcript, workflow_state
                          ) VALUES (
                              'preupgrade-exam', $1, NOW(), 'Biology',
                              DATE '2026-11-10', '[]'::json, '[]'::json,
                              TRUE, '[]'::json, '{}'::json
                          )
                      """, uid)
                      await db.execute("""
                          INSERT INTO test_prep_plans (
                              id, test_profile_id, user_id, created_at, updated_at,
                              status, version, total_sessions, weekly_milestones
                          ) VALUES (
                              'preupgrade-plan', 'preupgrade-exam', $1, NOW(), NOW(),
                              'active', 1, 1, '[]'::json
                          )
                      """, uid)
                      await db.execute("""
                          INSERT INTO test_prep_sessions (
                              id, study_plan_id, user_id, scheduled_at,
                              duration_minutes, topic, session_type, status
                          ) VALUES (
                              'preupgrade-session', 'preupgrade-plan', $1,
                              TIMESTAMP '2026-10-20 15:00:00',
                              15, 'Cell structure', 'practice', 'scheduled'
                          )
                      """, uid)
                  async with db.transaction():
                      course_id = await db.fetchval("""
                          INSERT INTO courses (
                              title, description, difficulty_level, estimated_duration_hours,
                              is_published, is_featured, instructor_id, created_at, updated_at
                          ) VALUES (
                              'Pre-upgrade durable course', 'Original lessons must survive',
                              'BEGINNER', 1, FALSE, FALSE, $1, NOW(), NOW()
                          ) RETURNING id
                      """, uid)
                      await db.execute("""
                          INSERT INTO lessons (
                              title, content, content_type, course_id, order_index,
                              is_published, is_preview, created_at, updated_at
                          ) VALUES (
                              'Pre-upgrade original lesson', 'Preserve this exact lesson text',
                              'TEXT', $1, 1, FALSE, FALSE, NOW(), NOW()
                          )
                      """, course_id)
                  print("PASS seeded learner, exam, plan, session and legacy course/lesson")
              finally:
                  await db.close()

          asyncio.run(main())
          PY
      - name: Upgrade same PostgreSQL schema with candidate migrations
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: |
          alembic upgrade heads
          alembic upgrade heads
          alembic current
      - name: Confirm canonical journeys, tenant bootstrap and migration stamp
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import asyncio, os
          import asyncpg
          async def main():
              db = await asyncpg.connect(
                  "postgresql://testuser:testpassword@localhost:5432/lyoapp_test"
              )
              try:
                  required = {"learning_journeys", "journey_handoffs", "learning_goals", "organizations"}
                  existing = set(await db.fetchval("""
                      SELECT array_agg(table_name) FROM information_schema.tables
                      WHERE table_schema='public'
                  """) or [])
                  assert required <= existing, f"Missing tables: {required-existing}"
                  assert await db.fetchval("SELECT EXISTS(SELECT 1 FROM organizations WHERE id=1)")
                  heads = {r["version_num"] for r in await db.fetch("SELECT version_num FROM alembic_version")}
                  assert heads == {"launch_004"}, f"Combined release migration head missing: {heads}"
                  assert await db.fetchval("SELECT auth_version FROM users WHERE email='preupgrade-learner@example.com'") == 0
                  assert await db.fetchval("""
                      SELECT data_type FROM information_schema.columns
                      WHERE table_schema='public' AND table_name='refresh_tokens' AND column_name='token'
                  """) == "text"
                  preserved = await db.fetchrow("""
                      SELECT p.subject, s.topic, s.status, s.duration_minutes, u.email
                      FROM test_prep_sessions s
                      JOIN test_prep_plans x ON x.id = s.study_plan_id
                      JOIN test_profiles p ON p.id = x.test_profile_id
                      JOIN users u ON u.id = s.user_id
                      WHERE s.id = 'preupgrade-session'
                        AND p.id = 'preupgrade-exam'
                        AND x.id = 'preupgrade-plan'
                  """)
                  assert preserved is not None, "Existing linked learner study plan was lost"
                  assert (
                      preserved["subject"], preserved["topic"], preserved["status"],
                      preserved["duration_minutes"], preserved["email"]
                  ) == (
                      "Biology", "Cell structure", "scheduled", 15,
                      "preupgrade-learner@example.com",
                  ), f"Existing exam/session data changed unexpectedly: {preserved}"
                  expected_course_columns = {
                      "topic", "status", "published_at", "organization_id", "generation_metadata"
                  }
                  expected_lesson_columns = {"topic", "tags", "organization_id"}
                  for table, needed in (("courses", expected_course_columns),
                                        ("lessons", expected_lesson_columns)):
                      columns = {row["column_name"] for row in await db.fetch("""
                          SELECT column_name FROM information_schema.columns
                          WHERE table_schema='public' AND table_name=$1
                      """, table)}
                      assert needed <= columns, f"Missing durable {table} columns: {needed-columns}"
                  preserved_course = await db.fetchrow("""
                      SELECT c.title, c.status, c.difficulty_level, c.organization_id,
                             l.title AS lesson_title, l.content, l.content_type, l.organization_id AS lesson_org
                      FROM courses c JOIN lessons l ON l.course_id = c.id
                      WHERE c.title = 'Pre-upgrade durable course'
                  """)
                  assert preserved_course is not None, "Legacy course and lesson disappeared"
                  assert (
                      preserved_course["title"], preserved_course["status"],
                      preserved_course["difficulty_level"], preserved_course["organization_id"],
                      preserved_course["lesson_title"], preserved_course["content"],
                      preserved_course["content_type"], preserved_course["lesson_org"]
                  ) == (
                      "Pre-upgrade durable course", "draft", "beginner", 1,
                      "Pre-upgrade original lesson", "Preserve this exact lesson text", "text", 1
                  ), "Legacy course and lesson content, ownership or enum semantics changed"
                  for chat_table in (
                      "chat_courses", "chat_notes", "chat_conversations",
                      "chat_messages", "chat_telemetry", "chat_highlights"
                  ):
                      columns = {row["column_name"] for row in await db.fetch("""
                          SELECT column_name FROM information_schema.columns
                          WHERE table_schema='public' AND table_name=$1
                      """, chat_table)}
                      assert "organization_id" in columns, f"Missing tenant on {chat_table}"
                  msg_columns = {row["column_name"] for row in await db.fetch("""
                      SELECT column_name FROM information_schema.columns
                      WHERE table_schema='public' AND table_name='chat_messages'
                  """)}
                  assert {"client_message_id", "blocks"} <= msg_columns
                  print("PASS legacy Chat tenant/streaming schema and historical learning rows preserved")
              finally:
                  await db.close()
          asyncio.run(main())
          PY
