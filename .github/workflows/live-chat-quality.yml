name: Live Chat quality validation

# Manual only. Uses the same dedicated non-production learner credential as
# teacher-quality validation and talks only to deployed public Chat contracts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-chat-quality-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deployed Chat experience
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYO_BASE_URL: https://api.lyoai.app
      LYO_ACCESS_TOKEN: ${{ secrets.LYO_TEACHER_QUALITY_TOKEN }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install black-box validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx pytest

      - name: Prove harness parser and safety
        run: python -m pytest -q --noconftest tests/test_live_chat_quality_harness.py

      - name: Require dedicated learner credential
        shell: bash
        run: |
          if [ -z "$LYO_ACCESS_TOKEN" ]; then
            echo "::error::Configure LYO_TEACHER_QUALITY_TOKEN before running live Chat validation."
            exit 2
          fi

      - name: Run deployed black-box Chat validation
        shell: bash
        run: |
          mkdir -p artifacts/chat-quality
          python scripts/live_chat_quality.py             --output "artifacts/chat-quality/live-chat-${GITHUB_RUN_ID}.json"

      - name: Upload redacted Chat-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-quality-${{ github.run_id }}
          path: artifacts/chat-quality/*.json
          if-no-files-found: warn
          retention-days: 30
